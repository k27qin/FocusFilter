<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Focus Filter + Chaos</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui;
            background: #111;
            color: #f0f0f0;
        }

        h1 {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 2.5rem;
            z-index: 10;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        #backgroundCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .ui-container {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 120px;
            /* leave space for h1 */
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .key {
            width: 100px;
            height: 100px;
            background: #000;
            border: 2px solid #444;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
        }

        .key.pressed {
            border-color: #0f0;
        }

        .paging {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .page-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #555;
        }

        .page-btn.pressed {
            background: #0f0;
            color: black;
        }

        #log {
            font-family: monospace;
            margin-top: 20px;
            color: #888;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        button {
            transition: opacity 0.2s ease;
            margin: 5px;
        }
    </style>
</head>

<body>
    <h1>Focus Filter</h1>

    <canvas id="backgroundCanvas"></canvas>

    <div class="ui-container">
        <button id="connectBtn">Connect MX Creative</button>
        <button id="connectMouseBtn">Connect MX Master 4</button>

        <div class="grid" id="grid"></div>
        <div id="log">Waiting for connection...</div>
    </div>

    <script type="module" src="app.js"></script>

    <script>
        // Full-screen chaotic bouncing circles
        const canvas = document.getElementById('backgroundCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Circle {
            constructor() {
                this.radius = 10 + Math.random() * 40;
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.dx = (Math.random() - 0.5) * 6;
                this.dy = (Math.random() - 0.5) * 6;
                this.hue = Math.random() * 360;
                this.sizePulseRate = Math.random() * 0.05;
            }
            update() {
                this.x += this.dx;
                this.y += this.dy;

                if (this.x + this.radius > canvas.width || this.x - this.radius < 0) this.dx *= -1;
                if (this.y + this.radius > canvas.height || this.y - this.radius < 0) this.dy *= -1;

                this.hue += 0.5;
                this.radius += Math.sin(Date.now() * 0.002 + this.sizePulseRate) * 0.3;
                if (this.radius < 5) this.radius = 5; // Prevent negative radius
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.hue}, 80%, 60%)`;
                ctx.fill();
            }
        }

        const circles = [];
        const numCircles = 50;
        for (let i = 0; i < numCircles; i++) {
            circles.push(new Circle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let c of circles) {
                c.update();
                c.draw();
            }
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>

</html>
