<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MX Creative Console - Module Demo</title>
    <style>
        body {
            font-family: system-ui;
            background: #1a1a1a;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .key {
            width: 100px;
            height: 100px;
            background: #000;
            border: 2px solid #444;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
        }

        .key.pressed {
            border-color: #0f0;
        }

        .paging {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .page-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #555;
        }

        .page-btn.pressed {
            background: #0f0;
            color: black;
        }

        #log {
            font-family: monospace;
            margin-top: 20px;
            color: #888;
        }
    </style>
</head>

<body>
    <h1>Focus Filter</h1>
    <button id="connectBtn">Connect Device</button>

    <div class="grid" id="grid"></div>
    <div class="paging">
        <div class="page-btn" id="key-9">P1</div>
        <div class="page-btn" id="key-10">P2</div>
    </div>
    <div id="log">Waiting for connection...</div>

    <script type="module" src="app.js">
    </script>
</body>

</html>
